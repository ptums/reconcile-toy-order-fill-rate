[project]
name = "reconcile-toy-order-fill-rate"
version = "0.1.0"
description = "Reconcile store orders with supplier fill-rate reports. Modernization of a 2021 Node.js tool."
requires-python = ">=3.12"
dependencies = ["store-client", "mock-store", "reconciler-api", "reconciler-worker"]

[tool.uv.sources]
store-client = { workspace = true }
mock-store = { workspace = true }
reconciler-api = { workspace = true }
reconciler-worker = { workspace = true }

[tool.uv.workspace]
members = ["services/*", "packages/*"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
