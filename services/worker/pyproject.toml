[project]
name = "reconciler-worker"
version = "0.1.0"
description = "Worker (consumer): diffs and reconciles order lines through the store adapter."
requires-python = ">=3.12"
dependencies = ["store-client", "nats-py>=2.7", "boto3>=1.34"]

[tool.uv.sources]
store-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
