[project]
name = "reconciler-api"
version = "0.1.0"
description = "Upload API (producer): stores the CSV, creates a job, publishes one message per row."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "nats-py>=2.7", "boto3>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
